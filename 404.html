<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Перенаправление...</title>
    <meta name="robots" content="noindex" />
    <script>
      // Карта редиректов: старый путь -> новый путь
      const redirects = {
        "/device/": "/?service=not-found",
        "/device.html": "/?service=not-found",
        "/box-shadows/": "https://github.com/andrejsharapov/vue3-box-shadows",
        "/box-shadows.html": "https://github.com/andrejsharapov/vue3-box-shadows",
        // Добавляй сюда старые ссылки
      };

      const path = window.location.pathname;

      if (redirects[path]) {
        window.location.replace(redirects[path]);
      } else {
        // Если редиректа нет, показываем 404 (или редиректим на not-found)
        window.location.replace("/?service=not-found");
      }
    </script>
  </head>
  <body></body>
</html>
